<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Przeciąganie liny – Matematyka</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div id="app">

<header class="topbar">
  <div class="title">Przeciąganie liny – Matematyka</div>

  <div class="controls">
    <button id="btnMode" class="btn">Tryb: 2 drużyny</button>

    <select id="difficulty">
      <option value="1">Poziom 1</option>
      <option value="2">Poziom 2</option>
      <option value="3" selected>Poziom 3</option>
      <option value="4">Poziom 4</option>
      <option value="5">Poziom 5</option>
    </select>

    <select id="cpuSpeed">
      <option value="very_slow">CPU: Bardzo wolny</option>
      <option value="slow" selected>CPU: Wolny</option>
      <option value="normal">CPU: Normalny</option>
      <option value="fast">CPU: Szybki</option>
    </select>

    <button id="btnFullscreen" class="btn">Pełny ekran</button>
    <button id="btnReset" class="btn danger">Reset</button>
  </div>
</header>

<main class="layout">

  <section class="team">
    <h2>Drużyna A</h2>
    <div id="displayA" class="display">—</div>
    <div id="keypadA" class="keypad"></div>
  </section>

  <section class="arena">
    <div id="question" class="question">—</div>

    <div class="ropeTrack">
      <div class="centerLine"></div>
      <div id="rope" class="rope">
        <div class="flag">🏳️</div>
      </div>
    </div>
  </section>

  <section class="team" id="teamB">
    <h2 id="teamBTitle">Drużyna B</h2>
    <div id="displayB" class="display">—</div>
    <div id="keypadB" class="keypad"></div>
  </section>

</main>
</div>

<script src="main.js"></script>
</body>
</html>
