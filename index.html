<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Przeciąganie liny – Matematyka</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div id="app">

  <header class="topbar">
    <div class="title">Przeciąganie liny – Matematyka</div>

    <div class="actions">
      <button id="btnMode" class="btn ghost">Tryb: 2 drużyny</button>
      <button id="btnFullscreen" class="btn ghost">Pełny ekran</button>
      <button id="btnReset" class="btn danger">Reset</button>
    </div>
  </header>

  <main class="layout">

    <!-- ARENA -->
    <section class="arena">
      <div class="question" id="question">—</div>

      <div class="ropeTrack">
        <div class="centerLine"></div>
        <div id="rope" class="rope"></div>
      </div>
    </section>

    <!-- TEAM A -->
    <section class="team">
      <h2>Drużyna A</h2>
      <div id="displayA" class="display">—</div>
      <div id="keypadA" class="keypad"></div>
    </section>

    <!-- TEAM B -->
    <section class="team" id="teamB">
      <h2 id="teamBTitle">Drużyna B</h2>
      <div id="displayB" class="display">—</div>
      <div id="keypadB" class="keypad"></div>
    </section>

  </main>
</div>

<script src="main.js"></script>
</body>
</html>
