<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220">
  <title>Przeciąganie liny – Matematyka</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="title">Przeciąganie liny – Matematyka</div>
      <div class="sub">Dotyk • TV • Telefon • Szybkość = siła</div>
    </div>

    <div class="actions">
      <button id="btnMode" class="btn ghost">Tryb: 2 drużyny</button>

      <label class="selectWrap" title="Poziom">
        <span>Poziom</span>
        <select id="difficulty">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>

      <button id="btnFullscreen" class="btn ghost">Pełny ekran</button>
      <button id="btnReset" class="btn danger">Reset</button>
    </div>
  </header>

  <main class="layout">
    <!-- ARENA -->
    <section class="arena" aria-label="Arena">
      <div class="questionCard">
        <div class="question" id="question">—</div>
        <div class="status" id="status">Wpisz wynik i kliknij OK.</div>
      </div>

      <div class="ropeTrack" aria-label="Lina">
        <div class="centerLine"></div>
        <div class="winLine left"></div>
        <div class="winLine right"></div>

        <div id="rope" class="rope">
          <div class="flag">🏳️</div>
        </div>
      </div>

      <div class="meta">
        Pozycja: <strong id="ropePos">0</strong> (A ← -100 … +100 → B)
      </div>

      <div id="winnerOverlay" class="winner hidden" aria-hidden="true">
        <div class="winnerCard">
          <div id="winnerText" class="winnerText">Wygrywa —</div>
          <button id="btnPlayAgain" class="btn big">Graj dalej</button>
        </div>
      </div>
    </section>

    <!-- TEAM A -->
    <section class="team" aria-label="Drużyna A">
      <div class="teamHead">
        <h2>Drużyna A</h2>
        <div class="mini">Kombo: <strong id="comboA">0</strong></div>
      </div>

      <div id="displayA" class="display">—</div>
      <div id="keypadA" class="keypad"></div>
    </section>

    <!-- TEAM B -->
    <section class="team" id="teamB" aria-label="Drużyna B">
      <div class="teamHead">
        <h2 id="teamBTitle">Drużyna B</h2>
        <div class="mini">Kombo: <strong id="comboB">0</strong></div>
      </div>

      <div id="displayB" class="display">—</div>
      <div id="keypadB" class="keypad"></div>
    </section>

  </main>
</div>

<script src="main.js"></script>
</body>
</html>
